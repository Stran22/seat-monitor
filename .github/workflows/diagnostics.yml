name: Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MONITOR_TARGETS_JSON: ${{ secrets.MONITOR_TARGETS_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run diagnose
